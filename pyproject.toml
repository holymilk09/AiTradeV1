[project]
name = "aitrade"
version = "0.1.0"
description = "Algo trading foundation on Alpaca with NautilusTrader backtesting"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "AiTradeV1" }]
dependencies = [
    "alpaca-py>=0.34.1",
    "nautilus-trader>=1.200.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "loguru>=0.7",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
aitrade = "aitrade.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitrade"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RET", "PL", "PT"]
# UP042: str+Enum kept for JSON-serialization compat; PLC0415: lazy imports are
# intentional for heavy deps (alpaca-py, nautilus-trader) and to keep CLI cold-start fast.
# PLR09xx: complexity thresholds fire on the CLI / bot runner — acceptable here.
# B008: typer.Option in defaults is the idiomatic Typer pattern.
# N818: our exception naming is intentional.
ignore = [
    "PLR0913", "PLR2004", "UP042", "PLC0415",
    "PLR0911", "PLR0912", "PLR0915",
    "B008", "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "PLC0415"]

[tool.mypy]
python_version = "3.11"
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/aitrade"]

[[tool.mypy.overrides]]
# Alpaca SDK responses use union types (model | dict); type narrowing at call
# sites produces noise. Silence those specific modules without loosening the rest.
module = ["aitrade.brokers.alpaca", "aitrade.data.alpaca_data"]
disable_error_code = ["union-attr", "arg-type", "assignment", "no-untyped-call"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
